<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const VOID = 0x140818;
const CPK = { C: 0x909090, H: 0xffffff, O: 0xff0d0d };
const SATIN = { metalness: 0.32, roughness: 0.45, clearcoat: 0.22, clearcoatRoughness: 0.38 };

function fail(msg) { throw new Error(`[ethanol] ${msg}`); }
function sub(a, b) { return a.map((x, i) => x - b[i]); }
function add(a, b) { return a.map((x, i) => x + b[i]); }
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function cross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}
function len(v) { return Math.hypot(v[0], v[1], v[2]); }
function norm(v) { const l = len(v); return [v[0] / l, v[1] / l, v[2] / l]; }
function scale(v, s) { return [v[0] * s, v[1] * s, v[2] * s]; }
function ang(a, b) {
  return Math.acos(Math.min(1, Math.max(-1, dot(norm(a), norm(b))))) * 180 / Math.PI;
}
function rodrigues(v, k, theta) {
  const c = Math.cos(theta);
  const s = Math.sin(theta);
  const d = dot(k, v);
  const cr = cross(k, v);
  return [
    v[0] * c + cr[0] * s + k[0] * d * (1 - c),
    v[1] * c + cr[1] * s + k[1] * d * (1 - c),
    v[2] * c + cr[2] * s + k[2] * d * (1 - c),
  ];
}
function dihedral(a, b, c, d) {
  const b1 = sub(b, a);
  const b2 = sub(c, b);
  const b3 = sub(d, c);
  const n1 = norm(cross(b1, b2));
  const n2 = norm(cross(b2, b3));
  const x = dot(n1, n2);
  const y = dot(cross(n1, n2), norm(b2));
  return Math.atan2(y, x) * 180 / Math.PI;
}
function near(v, target, tol, msg) {
  if (Math.abs(v - target) > tol) fail(`${msg}: ${v} ≠ ${target}`);
}

/* Gas-phase teaching geometry, anti conformer.
   C–C 1.512 Å, C–O 1.431 Å, C–H 1.096 Å, O–H 0.971 Å.
   Carbon angles are tetrahedral arccos(−1/3). C–O–H is 108.5°. */
function buildEthanol() {
  const TET = Math.acos(-1 / 3);
  const CC = 1.512, CO = 1.431, CH = 1.096, OH = 0.971;
  const COH = 108.5 * Math.PI / 180;
  const tet = [norm([1, 1, 1]), norm([1, -1, -1]), norm([-1, 1, -1]), norm([-1, -1, 1])];
  const C1 = [0, 0, 0];
  const C2 = scale(tet[0], CC);
  const O = scale(tet[1], CO);
  const Ha1 = scale(tet[2], CH);
  const Ha2 = scale(tet[3], CH);
  const axis = norm(sub(C2, C1));
  const oDir = norm(O);
  const oPerp = norm(sub(oDir, scale(axis, dot(oDir, axis))));
  const back = scale(axis, -1);
  const antiPerp = scale(oPerp, -1);
  const hAntiDir = norm(add(scale(back, Math.cos(TET)), scale(antiPerp, Math.sin(TET))));
  const methyl = [0, 1, 2].map((i) => add(C2, scale(norm(rodrigues(hAntiDir, back, i * 2 * Math.PI / 3)), CH)));
  const oBack = norm(sub(C1, O));
  const c1o = norm(sub(O, C1));
  const cPerp = norm(sub(sub(C2, C1), scale(c1o, dot(sub(C2, C1), c1o))));
  const Ho = add(O, scale(norm(add(scale(oBack, Math.cos(COH)), scale(scale(cPerp, -1), Math.sin(COH)))), OH));
  const atoms = [
    { id: 'Ca', el: 'C', role: 'Cα · methylene carbon', p: C1 },
    { id: 'Cb', el: 'C', role: 'Cβ · methyl carbon', p: C2 },
    { id: 'O', el: 'O', role: 'hydroxyl oxygen', p: O },
    { id: 'Ha1', el: 'H', role: 'methylene hydrogen', p: Ha1 },
    { id: 'Ha2', el: 'H', role: 'methylene hydrogen', p: Ha2 },
    { id: 'Hm1', el: 'H', role: 'methyl hydrogen · anti to O', p: methyl[0] },
    { id: 'Hm2', el: 'H', role: 'methyl hydrogen · gauche', p: methyl[1] },
    { id: 'Hm3', el: 'H', role: 'methyl hydrogen · gauche', p: methyl[2] },
    { id: 'Ho', el: 'H', role: 'hydroxyl hydrogen', p: Ho },
  ];
  const bonds = [
    ['Ca', 'Cb'], ['Ca', 'O'], ['Ca', 'Ha1'], ['Ca', 'Ha2'],
    ['Cb', 'Hm1'], ['Cb', 'Hm2'], ['Cb', 'Hm3'], ['O', 'Ho'],
  ];
  const byId = Object.fromEntries(atoms.map((a) => [a.id, a]));
  const counts = atoms.reduce((m, a) => (m[a.el] = (m[a.el] || 0) + 1, m), {});
  if (counts.C !== 2 || counts.H !== 6 || counts.O !== 1) fail(`formula C${counts.C}H${counts.H}O${counts.O}`);
  if (bonds.length !== 8) fail('ethanol has 8 single bonds');
  near(len(sub(C2, C1)), CC, 1e-6, 'C–C');
  near(len(sub(O, C1)), CO, 1e-6, 'C–O');
  near(len(sub(Ho, O)), OH, 1e-6, 'O–H');
  for (const h of [Ha1, Ha2, ...methyl]) near(len(sub(h, h === Ha1 || h === Ha2 ? C1 : C2)), CH, 1e-3, 'C–H');
  near(len(sub(Ha1, C1)), CH, 1e-6, 'Cα–H');
  near(len(sub(methyl[0], C2)), CH, 1e-6, 'Cβ–H');
  const tetDeg = TET * 180 / Math.PI;
  for (const h of [Ha1, Ha2]) near(ang(sub(C2, C1), sub(h, C1)), tetDeg, 0.05, '∠C–C–H');
  near(ang(sub(C2, C1), sub(O, C1)), tetDeg, 0.05, '∠C–C–O');
  near(ang(sub(Ha1, C1), sub(Ha2, C1)), tetDeg, 0.05, '∠H–C–H methylene');
  near(ang(sub(O, C1), sub(Ha1, C1)), tetDeg, 0.05, '∠O–C–H');
  for (const h of methyl) near(ang(sub(C1, C2), sub(h, C2)), tetDeg, 0.05, '∠C–C–H methyl');
  near(ang(sub(methyl[0], C2), sub(methyl[1], C2)), tetDeg, 0.05, '∠H–C–H methyl');
  near(ang(sub(C1, O), sub(Ho, O)), 108.5, 0.05, '∠C–O–H');
  near(Math.abs(dihedral(Ho, O, C1, C2)), 180, 0.2, 'dihedral H–O–C–C');
  near(Math.abs(dihedral(O, C1, C2, methyl[0])), 180, 0.2, 'dihedral O–C–C–H anti');
  near(Math.abs(Math.abs(dihedral(O, C1, C2, methyl[1])) - 60), 0, 0.3, 'dihedral gauche');
  near(Math.abs(Math.abs(dihedral(O, C1, C2, methyl[2])) - 60), 0, 0.3, 'dihedral gauche');
  if (CPK.C === CPK.H || CPK.C === CPK.O || CPK.H === CPK.O) fail('CPK colors must be distinct');
  const measured = bonds.map(([a, b]) => ({
    a, b, elA: byId[a].el, elB: byId[b].el, angstrom: len(sub(byId[a].p, byId[b].p)),
  }));
  return { atoms, bonds: measured, tetDeg, byId };
}

const model = buildEthanol();
const heavy = model.atoms.filter((a) => a.el !== 'H');
const centroid = heavy.reduce((s, a) => add(s, a.p), [0, 0, 0]).map((v) => v / heavy.length);
const SHOW = 1.28;
for (const a of model.atoms) a.world = sub(a.p, centroid).map((v) => v * SHOW);

const bondList = document.getElementById('bondList');
const groups = [
  ['C–C', model.bonds.filter((b) => b.elA === 'C' && b.elB === 'C')],
  ['C–O', model.bonds.filter((b) => (b.elA === 'C' && b.elB === 'O') || (b.elA === 'O' && b.elB === 'C'))],
  ['C–H', model.bonds.filter((b) => (b.elA === 'C' && b.elB === 'H') || (b.elA === 'H' && b.elB === 'C'))],
  ['O–H', model.bonds.filter((b) => (b.elA === 'O' && b.elB === 'H') || (b.elA === 'H' && b.elB === 'O'))],
];
bondList.textContent = groups.map(([name, rows]) => {
  const L = rows[0].angstrom.toFixed(3);
  return `${name} ${L} Å${rows.length > 1 ? ` ×${rows.length}` : ''}`;
}).join(' · ') + ` · ∠C ${model.tetDeg.toFixed(2)}° · ∠C–O–H 108.50° · H–O–C–C 180°`;

const params = new URLSearchParams(location.search);
const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
let still = motionQuery.matches || params.has('still');
const ua = navigator.userAgent || '';
const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isMobile = isIOS || matchMedia('(pointer: coarse)').matches || matchMedia('(max-width: 720px)').matches;

const stage = document.getElementById('stage');
const pickTitle = document.getElementById('pickTitle');
const pickRead = document.getElementById('pickRead');
const errEl = document.getElementById('err');
const look = { x: 0, y: 0, tx: 0, ty: 0 };
const camHold = new THREE.Vector3();
const UP = new THREE.Vector3(0, 1, 0);
let renderer, scene, camera, controls, mol, floor, raf = 0;
let dragging = false;
const clock = new THREE.Clock();
let t = 0;
const atomMeshes = [];
const baseScale = { C: 0.4, O: 0.36, H: 0.22 };

try {
  renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: isIOS ? 'default' : 'high-performance',
  });
  if (!renderer.getContext()) fail('no-gl');
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  renderer.setPixelRatio(dpr);
  if (renderer.getPixelRatio() > 1.5) fail('DPR cap');
  renderer.setClearColor(VOID, 1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  stage.appendChild(renderer.domElement);

  const gl = renderer.getContext();
  const isWebGL2 = typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext;
  const useAnisotropy = !isMobile && isWebGL2;
  function makeSatin(color, emissiveIntensity) {
    const o = {
      color,
      metalness: SATIN.metalness,
      roughness: SATIN.roughness,
      clearcoat: SATIN.clearcoat,
      clearcoatRoughness: SATIN.clearcoatRoughness,
      emissive: color,
      emissiveIntensity,
    };
    o.anisotropy = useAnisotropy ? 0.55 : 0;
    if (useAnisotropy) o.anisotropyRotation = Math.PI / 2;
    const mat = new THREE.MeshPhysicalMaterial(o);
    if (mat.metalness !== 0.32 || mat.roughness !== 0.45 || mat.clearcoat !== 0.22) {
      fail('satin params drifted');
    }
    if (isMobile && mat.anisotropy !== 0) fail('mobile anisotropy must be off');
    return mat;
  }

  scene = new THREE.Scene();
  scene.background = new THREE.Color(VOID);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.5;
  pmrem.dispose();
  scene.add(new THREE.HemisphereLight(0xc4b8e0, 0x2a1218, 0.55));
  const key = new THREE.PointLight(0xffb36b, 1.45, 40, 2);
  key.position.set(4.2, 5.2, 6);
  scene.add(key);
  const fill = new THREE.PointLight(0x6a8cff, 0.32, 30, 2);
  fill.position.set(-5, -1.5, -3);
  scene.add(fill);

  floor = new THREE.Group();
  const grid = new THREE.GridHelper(28, 14, 0xffffff, 0xffffff);
  grid.material.transparent = true;
  grid.material.opacity = 0.42;
  grid.material.depthWrite = false;
  grid.material.toneMapped = true;
  grid.material.color.setHex(0x7a4458);
  const disc = new THREE.Mesh(
    new THREE.CircleGeometry(7.5, isMobile ? 40 : 64),
    new THREE.MeshBasicMaterial({ color: 0x1c0e22, transparent: true, opacity: 0.28, depthWrite: false, side: THREE.DoubleSide })
  );
  disc.rotation.x = -Math.PI / 2;
  disc.position.y = -0.02;
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(2.15, 2.24, isMobile ? 48 : 80),
    new THREE.MeshBasicMaterial({ color: 0xffb36b, transparent: true, opacity: 0.55, depthWrite: false, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.02;
  floor.add(grid, disc, ring);
  floor.position.y = -1.85;
  scene.add(floor);

  const sphereW = isMobile ? 24 : 32;
  const sphereH = isMobile ? 20 : 28;
  const sphereGeo = new THREE.SphereGeometry(1, sphereW, sphereH);
  const bondGeo = new THREE.CylinderGeometry(0.055, 0.055, 1, isMobile ? 6 : 10);
  mol = new THREE.Group();
  const satinFor = {
    C: makeSatin(CPK.C, 0.05),
    H: makeSatin(CPK.H, 0.08),
    O: makeSatin(CPK.O, 0.1),
  };
  const bondSatin = {
    C: makeSatin(CPK.C, 0.03),
    H: makeSatin(CPK.H, 0.04),
    O: makeSatin(CPK.O, 0.06),
  };
  for (const a of model.atoms) {
    const mesh = new THREE.Mesh(sphereGeo, satinFor[a.el]);
    mesh.scale.setScalar(baseScale[a.el]);
    mesh.position.set(a.world[0], a.world[1], a.world[2]);
    mesh.userData.atom = a;
    mesh.userData.base = baseScale[a.el];
    mol.add(mesh);
    atomMeshes.push(mesh);
  }
  const pos = Object.fromEntries(model.atoms.map((a) => [a.id, new THREE.Vector3(...a.world)]));
  for (const b of model.bonds) {
    const from = pos[b.a];
    const to = pos[b.b];
    const mid = from.clone().lerp(to, 0.5);
    addHalf(from, mid, bondSatin[b.elA]);
    addHalf(mid, to, bondSatin[b.elB]);
  }
  function addHalf(from, to, material) {
    const delta = new THREE.Vector3().subVectors(to, from);
    const length = delta.length();
    const dir = delta.multiplyScalar(1 / length);
    const mesh = new THREE.Mesh(bondGeo, material);
    mesh.scale.set(1, length, 1);
    mesh.position.copy(from).addScaledVector(dir, length * 0.5);
    mesh.quaternion.setFromUnitVectors(UP, dir);
    mol.add(mesh);
  }
  scene.add(mol);

  camera = new THREE.PerspectiveCamera(38, 1, 0.1, 80);
  camera.position.set(0.4, 1.15, isMobile ? 8.2 : 6.6);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enablePan = false;
  controls.minDistance = 3.2;
  controls.maxDistance = 14;
  controls.target.set(0, 0.05, 0);
  controls.addEventListener('start', () => { dragging = true; });
  controls.addEventListener('end', () => { dragging = false; });

  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let ptr = null;
  renderer.domElement.addEventListener('pointerdown', (e) => {
    ptr = { x: e.clientX, y: e.clientY, t: performance.now() };
  });
  renderer.domElement.addEventListener('pointerup', (e) => {
    if (!ptr) return;
    const moved = Math.hypot(e.clientX - ptr.x, e.clientY - ptr.y);
    ptr = null;
    if (moved > 8) return;
    const rect = renderer.domElement.getBoundingClientRect();
    ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    const hit = raycaster.intersectObjects(atomMeshes, false)[0];
    selectAtom(hit ? hit.object : null);
    if (still) renderFrame();
  });
} catch (e) {
  console.error(e);
  if (errEl) {
    errEl.style.display = 'block';
    errEl.textContent = 'This browser can’t draw the 3D molecule. Try another browser or update graphics.';
  }
}

function selectAtom(mesh) {
  for (const m of atomMeshes) {
    const on = m === mesh;
    m.scale.setScalar(m.userData.base * (on ? 1.12 : 1));
    m.material.emissiveIntensity = on ? 0.42 : (m.userData.atom.el === 'O' ? 0.1 : m.userData.atom.el === 'H' ? 0.08 : 0.05);
  }
  if (!mesh) {
    pickTitle.textContent = 'Anti · staggered';
    pickRead.textContent = 'Click an atom. Eight single bonds. Oxygen lone pairs are not drawn.';
    return;
  }
  const a = mesh.userData.atom;
  const touch = model.bonds.filter((b) => b.a === a.id || b.b === a.id);
  pickTitle.textContent = a.role;
  const bits = touch.map((b) => {
    const other = b.a === a.id ? b.elB : b.elA;
    return `${a.el}–${other} ${b.angstrom.toFixed(3)} Å`;
  });
  const extra = a.el === 'O'
    ? ' Angle C–O–H is 108.50°. Two lone pairs are not drawn.'
    : a.el === 'C'
      ? ' Four single bonds, tetrahedral.'
      : ' One single bond.';
  pickRead.textContent = bits.join(' · ') + '.' + extra;
}

function resize() {
  if (!renderer || !camera) return;
  const w = stage.clientWidth || 1;
  const h = stage.clientHeight || 1;
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(w, h, isMobile);
  if (still) renderFrame();
}
if (renderer) {
  new ResizeObserver(resize).observe(stage);
  resize();
}

function renderFrame() {
  if (!renderer) return;
  renderer.render(scene, camera);
}

function frame() {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;
  if (mol && !still && !dragging) mol.rotation.y += dt * 0.28;
  if (floor && !still) floor.rotation.y = Math.sin(t * 0.2) * 0.04;
  if (!still) {
    const ease = Math.min(1, dt * 4.5);
    look.x += (look.tx - look.x) * ease;
    look.y += (look.ty - look.y) * ease;
    if (!isMobile) {
      document.documentElement.style.setProperty('--px', look.x.toFixed(4));
      document.documentElement.style.setProperty('--py', look.y.toFixed(4));
    }
  }
  if (controls) controls.update();
  let nudged = false;
  if (camera && !still) {
    camHold.copy(camera.position);
    camera.position.x += look.x * 0.16;
    camera.position.y += look.y * 0.08;
    nudged = true;
  }
  renderFrame();
  if (nudged) camera.position.copy(camHold);
}

function holdStill() {
  cancelAnimationFrame(raf);
  raf = 0;
  if (mol) mol.rotation.set(0.35, 0.72, 0.08);
  if (controls) controls.update();
  renderFrame();
}

function start() {
  if (!renderer) return;
  if (still) { holdStill(); return; }
  if (raf) return;
  clock.getDelta();
  raf = requestAnimationFrame(frame);
}

addEventListener('pointermove', (e) => {
  if (still) return;
  look.tx = (e.clientX / innerWidth) * 2 - 1;
  look.ty = (e.clientY / innerHeight) * 2 - 1;
}, { passive: true });

motionQuery.addEventListener('change', (e) => {
  still = e.matches || params.has('still');
  if (still) holdStill();
  else start();
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
  else start();
});

if (renderer) start();
</script>
</body>
</html>
